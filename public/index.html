<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBank - Modern Banking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login View -->
        <div id="login-view" class="view active">
            <div class="login-card">
                <h1>NexBank</h1>
                <p class="subtitle">Secure & Modern Banking Simulation</p>
                <form id="login-form">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" value="user" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" value="password" required>
                    </div>
                    <button type="submit" class="btn primary">Login</button>
                    <p id="login-error" class="error"></p>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <header>
                <h2>Welcome, <span id="user-display"></span></h2>
                <button id="logout-btn" class="btn outline">Logout</button>
            </header>

            <div class="dashboard-content">
                <div class="main-column">
                    <h3>Your Accounts</h3>
                    <div id="accounts-container" class="accounts-grid">
                        <!-- Accounts injected here -->
                    </div>

                    <h3 class="mt-2">Transaction History</h3>
                    <div class="history-card">
                        <table id="history-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Type</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="history-body">
                                <!-- History injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="side-column">
                    <div class="action-card">
                        <h3>Quick Actions</h3>
                        <div class="tabs">
                            <button class="tab-btn active" data-target="deposit-form">Deposit</button>
                            <button class="tab-btn" data-target="withdraw-form">Withdraw</button>
                            <button class="tab-btn" data-target="transfer-form">Transfer</button>
                        </div>

                        <!-- Deposit Form -->
                        <form id="deposit-form" class="action-form active">
                            <div class="input-group">
                                <label>Account</label>
                                <select class="account-select" required></select>
                            </div>
                            <div class="input-group">
                                <label>Amount</label>
                                <input type="number" min="1" step="0.01" class="amount-input" required>
                            </div>
                            <button type="submit" class="btn primary w-100">Deposit Funds</button>
                        </form>

                        <!-- Withdraw Form -->
                        <form id="withdraw-form" class="action-form">
                            <div class="input-group">
                                <label>Account</label>
                                <select class="account-select" required></select>
                            </div>
                            <div class="input-group">
                                <label>Amount</label>
                                <input type="number" min="1" step="0.01" class="amount-input" required>
                            </div>
                            <button type="submit" class="btn primary w-100">Withdraw Funds</button>
                        </form>

                        <!-- Transfer Form -->
                        <form id="transfer-form" class="action-form">
                            <div class="input-group">
                                <label>From Account</label>
                                <select class="account-select" required></select>
                            </div>
                            <div class="input-group">
                                <label>To Account Number</label>
                                <input type="text" id="transfer-target" required>
                            </div>
                            <div class="input-group">
                                <label>Amount</label>
                                <input type="number" min="1" step="0.01" class="amount-input" required>
                            </div>
                            <button type="submit" class="btn primary w-100">Transfer Funds</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
